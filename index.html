<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101522;
      --card: #192033;
      --accent: #6ee7ff;
      --accent-strong: #ffd166;
      --text: #edf4ff;
      --muted: #9fb0c8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 20%, rgba(110, 231, 255, 0.22), transparent 32%),
        radial-gradient(circle at 80% 15%, rgba(255, 209, 102, 0.16), transparent 28%),
        linear-gradient(135deg, #0d1020, var(--bg));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    main {
      width: min(920px, calc(100% - 32px));
      padding: 36px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(16, 21, 34, 0.84);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 7vw, 5rem);
      letter-spacing: -0.06em;
    }

    .lead {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border-radius: 22px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(110, 231, 255, 0.7);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.25);
      outline: none;
    }

    .card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .card span {
      color: var(--muted);
      line-height: 1.55;
    }

    .play {
      background:
        linear-gradient(135deg, rgba(110, 231, 255, 0.22), rgba(255, 209, 102, 0.18)),
        var(--card);
    }

    .badge {
      align-self: flex-start;
      margin-bottom: 18px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.14);
      color: var(--accent-strong);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mini Arcade</h1>
    <p class="lead">
      브라우저에서 바로 실행되는 작은 게임 모음입니다. 새로 추가된 생존 슈팅 게임에서 몰려오는 적을 피하고 자동 사격으로 오래 버텨보세요.
    </p>

    <div class="cards">
      <a class="card play" href="Survivor.html">
        <div>
          <div class="badge">New game</div>
          <strong>생존 특공대</strong>
          <span>이동은 직접, 공격은 자동! 경험치를 모아 업그레이드를 고르고 점점 강해지는 적 웨이브를 버티는 아케이드 게임입니다.</span>
        </div>
      </a>

      <a class="card" href="Calculator.html">
        <div>
          <strong>계산기</strong>
          <span>기존 서부풍 계산기 페이지로 이동합니다.</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
