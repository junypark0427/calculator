<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>간단한 계산기</title>
</head>
<body>

    <h2>나의 첫 계산기</h2>

    <!-- 계산 결과가 표시될 곳 -->
    <input type="text" id="result" value="0" readonly>

    <br><br>

    <!-- 숫자 버튼들 -->
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>+</button>
    <br>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>-</button>
    <br>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>*</button>
    <br>
    <button>C</button>
    <button>0</button>
    <button>=</button>
    <button>/</button>

</body>
</html>
